<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="UTF-8">
<title>Restaurant Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="top-bar">
    <h2>Dashboard</h2>
    <div class="theme-toggle">
      <label class="switch">
        <input type="checkbox" id="themeToggle" onchange="toggleTheme(this)">
        <span class="slider"></span>
      </label>
      <span class="theme-label">Dark</span>
    </div>
  </div>

  <select id="restaurantSelect" class="restaurant-select" onchange="loadData()"></select>

  <div class="kpi-grid">
    <div class="kpi cash"><span>Cash</span><strong id="cashVal">$0</strong></div>
    <div class="kpi visa"><span>Visa</span><strong id="visaVal">$0</strong></div>
    <div class="kpi spent"><span>Spent</span><strong id="spentVal">$0</strong></div>
    <div class="kpi total"><span>Total</span><strong id="totalVal">$0</strong></div>
    <div class="chart-box"><canvas id="pie"></canvas></div>
  </div>

  <h3>Add / Edit Transaction</h3>
  <div class="form-grid modern-inputs">
    <div class="input-group"><span class="input-icon">$</span><input id="cashAmount" placeholder=" " oninput="recalcTotal()"><label>Cash</label></div>
    <div class="input-group"><span class="input-icon">$</span><input id="visaAmount" placeholder=" " oninput="recalcTotal()"><label>Visa</label></div>
    <div class="input-group"><span class="input-icon">$</span><input id="spentAmount" placeholder=" " oninput="recalcTotal()"><label>Spent</label></div>
    <div class="input-group readonly"><span class="input-icon">$</span><input id="calcTotal" readonly placeholder=" "><label>Total</label></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="saveTx()">💾 Save</button>
    <button class="btn btn-secondary" onclick="cancelEdit()">✖ Cancel</button>
  </div>

  <table class="modern">
    <thead>
      <tr><th>Date</th><th>Cash</th><th>Visa</th><th>Spent</th><th>Total</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="/js/app.js"></script>
</body>
</html>

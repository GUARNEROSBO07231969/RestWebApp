<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="UTF-8">
<title>Restaurant Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="top-bar">
    <h2>Dashboard</h2>
    <div class="theme-toggle">
      <label class="switch">
        <input type="checkbox" id="themeToggle" onchange="toggleTheme(this)">
        <span class="slider"></span>
      </label>
      <span class="theme-label">Dark</span>
    </div>
  </div>

  <select id="restaurantSelect" class="restaurant-select" onchange="loadData()"></select>

  <div class="kpi-grid">
    <div class="kpi cash"><span style="font-size:1.38rem">💵 Grand Total Cash</span><strong id="cashVal">$0</strong></div>
    <div class="kpi visa"><span style="font-size:1.38rem">💳 Grand Total Visa</span><strong id="visaVal">$0</strong></div>
    <div class="kpi spent"><span style="font-size:1.38rem">💸 Grand Total Expense</span><strong id="spentVal">$0</strong></div>
    <div class="kpi total"><span style="font-size:1.38rem">📊 Grand Total</span><strong id="totalVal">$0</strong></div>
    <div class="chart-box"><canvas id="pie"></canvas></div>
  </div>

  <h3>Add / Edit Transaction</h3>
  <div class="form-grid modern-inputs">
    <div class="input-group"><span class="input-icon">💵</span><input id="cashAmount" placeholder=" " oninput="recalcTotal()"><label>Cash Amount</label></div>
    <div class="input-group"><span class="input-icon">💳</span><input id="visaAmount" placeholder=" " oninput="recalcTotal()"><label>Visa Amount</label></div>
    <div class="input-group"><span class="input-icon">🏬</span><input id="storeName" placeholder=" "><label>Store Name</label></div>
    <div class="input-group"><span class="input-icon">💸</span><input id="spentAmount" placeholder=" " oninput="recalcTotal()"><label>Expense Amount</label></div>
    <div class="input-group readonly"><span class="input-icon">📊</span><input id="calcTotal" readonly placeholder=" "><label>Total</label></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="saveTx()">💾 Save</button>
    <button class="btn btn-secondary" onclick="cancelEdit()">✖ Cancel</button>
  </div>

  <div class="search-row" style="margin-bottom:4px;display:flex;align-items:center;gap:8px">
    <input id="tableSearch" type="text" placeholder="🔍 Search table..." style="flex:1;max-width:260px;padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;font-size:13px;" oninput="filterTable()">
  </div>

  <table class="modern">
    <thead>
      <tr>
        <th onclick="sortTable('date')" style="cursor:pointer" title="Sort by Date">Date <span class="sort-indicator" id="sort-date"></span></th>
        <th onclick="sortTable('cashAmount')" style="cursor:pointer" title="Sort by Cash Amount">Cash Amount <span class="sort-indicator" id="sort-cashAmount"></span></th>
        <th onclick="sortTable('visaAmount')" style="cursor:pointer" title="Sort by Visa Amount">Visa Amount <span class="sort-indicator" id="sort-visaAmount"></span></th>
        <th onclick="sortTable('storeName')" style="cursor:pointer" title="Sort by Store Name">Store Name <span class="sort-indicator" id="sort-storeName"></span></th>
        <th onclick="sortTable('spent')" style="cursor:pointer" title="Sort by Expense Amount">Expense Amount <span class="sort-indicator" id="sort-spent"></span></th>
        <th onclick="sortTable('totalAmount')" style="cursor:pointer" title="Sort by Total">Total <span class="sort-indicator" id="sort-totalAmount"></span></th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="grand-total-row-container"></div>
  <div id="pagination" class="pagination"></div>

  <script src="/js/app.js"></script>
</body>
</html>

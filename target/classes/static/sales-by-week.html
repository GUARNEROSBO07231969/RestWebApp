<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales by Week Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .content {
      padding: 30px;
    }
    
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .control-group label {
      font-weight: 600;
      color: #334155;
      font-size: 14px;
    }
    
    select {
      padding: 10px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 250px;
    }
    
    select:hover {
      border-color: #2563eb;
    }
    
    select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    
    .summary-card {
      padding: 16px;
      border-radius: 10px;
      border-left: 4px solid;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s;
    }
    
    .summary-card:hover {
      transform: translateY(-2px);
    }
    
    .summary-card.blue {
      background: #f0f9ff;
      border-color: #2563eb;
    }
    
    .summary-card.green {
      background: #f0fdf4;
      border-color: #22c55e;
    }
    
    .summary-card.yellow {
      background: #fef3c7;
      border-color: #f59e42;
    }
    
    .summary-card.pink {
      background: #fce7f3;
      border-color: #ec4899;
    }
    
    .summary-card.purple {
      background: #f3e8ff;
      border-color: #9333ea;
    }
    
    .summary-card-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .summary-card-value {
      font-size: 22px;
      font-weight: 700;
      color: inherit;
    }
    
    .summary-card.blue .summary-card-value { color: #2563eb; }
    .summary-card.green .summary-card-value { color: #22c55e; }
    .summary-card.yellow .summary-card-value { color: #f59e42; }
    .summary-card.pink .summary-card-value { color: #ec4899; }
    .summary-card.purple .summary-card-value { color: #9333ea; }
    
    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    
    thead {
      background: #f1f5f9;
      border-bottom: 2px solid #e2e8f0;
    }
    
    th {
      padding: 14px;
      text-align: right;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    
    th:first-child {
      text-align: left;
    }
    
    td {
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
      color: #475569;
    }
    
    td:first-child {
      text-align: left;
      font-weight: 500;
      color: #334155;
    }
    
    tbody tr:hover {
      background: #f8fafc;
    }
    
    tbody tr.highlight {
      background: rgba(254, 242, 242, 0.92) !important;
      color: #b91c1c;
      border: 1px solid #dc2626 !important;
    }
    
    tbody tr.totals {
      background: #fef3c7;
      font-weight: bold;
      color: #92400e;
      border-top: 2px solid #f59e42;
    }
    
    .no-data {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    
    .no-data-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #e5e7eb;
      color: #374151;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .back-link:hover {
      background: #d1d5db;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .export-button {
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .export-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Sales by Week Dashboard</h1>
      <p>View detailed sales breakdown by week with comprehensive metrics</p>
    </div>
    
    <div class="content">
      <a href="javascript:history.back()" class="back-link" id="backLink">← Back to App</a>
      
      <div id="restaurantTitle" style="margin-bottom: 20px; font-size: 18px; font-weight: 600; color: #1e293b;">
        Loading...
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label for="weekSelector">Select Week:</label>
          <select id="weekSelector" onchange="onWeekSelectorChange()">
            <option value="">Loading weeks...</option>
          </select>
        </div>
        <div class="button-group">
          <button class="export-button" onclick="exportWeekToPDF()">🖨️ Print PDF</button>
          <button class="export-button" onclick="exportWeekToExcel()">📋 Print Excel</button>
          <a href="/" class="export-button" style="text-decoration: none; display: inline-flex; align-items: center;">📊 Sales Dashboard</a>
        </div>
      </div>
      
      <div id="weekSalesSummary" class="summary-grid">
        <!-- Summary cards populated by JavaScript -->
      </div>
      
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Captured Sale</th>
              <th>Cash</th>
              <th>Visa</th>
              <th>DoorDash</th>
              <th>GrubHub</th>
              <th>Uber Eats</th>
              <th>Online</th>
              <th>Store Name</th>
              <th>Expense</th>
              <th>Total Sale</th>
            </tr>
          </thead>
          <tbody id="weekSalesTableBody">
            <tr>
              <td colspan="11" class="no-data">
                <div class="no-data-icon">📈</div>
                <div>Select a week to view sales details</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let allWeekData = {};
    let selectedRestaurantId = null;
    let selectedRestaurantName = null;
    
    // Initialize dashboard when page loads
    document.addEventListener('DOMContentLoaded', function() {
      // Get restaurant ID from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      selectedRestaurantId = urlParams.get('restaurantId');
      
      if (!selectedRestaurantId) {
        // If no restaurant ID in URL, try to load default restaurant
        loadDefaultRestaurant();
        return;
      }
      
      loadRestaurantName();
      loadSalesData();
    });
    
    // Load default restaurant if none specified
    async function loadDefaultRestaurant() {
      try {
        const response = await fetch('/api/restaurants');
        const restaurants = await response.json();
        
        if (restaurants.length === 0) {
          alert('No restaurants found. Please contact administrator.');
          window.history.back();
          return;
        }
        
        // Use first restaurant as default
        selectedRestaurantId = restaurants[0].id;
        selectedRestaurantName = restaurants[0].name;
        document.getElementById('restaurantTitle').textContent = `📍 ${restaurants[0].name} - Sales by Week`;
        
        loadSalesData();
      } catch (error) {
        console.error('Error loading default restaurant:', error);
        alert('Error loading restaurants. Please select a restaurant from the Sales tab.');
        window.history.back();
      }
    }
    
    // Load restaurant name to display in title
    async function loadRestaurantName() {
      try {
        const response = await fetch('/api/restaurants');
        const restaurants = await response.json();
        const restaurant = restaurants.find(r => r.id == selectedRestaurantId);
        
        if (restaurant) {
          selectedRestaurantName = restaurant.name;
          document.getElementById('restaurantTitle').textContent = `📍 ${restaurant.name} - Sales by Week`;
        } else {
          document.getElementById('restaurantTitle').textContent = 'Sales by Week';
        }
      } catch (error) {
        console.error('Error loading restaurant name:', error);
        document.getElementById('restaurantTitle').textContent = 'Sales by Week';
      }
    }
    
    // Update back link to return to Sales tab with selected restaurant preserved
    function updateBackLink() {
      const backLink = document.getElementById('backLink');
      if (backLink && selectedRestaurantId) {
        const backURL = `/?restaurantId=${selectedRestaurantId}#sales`;
        backLink.href = backURL;
        backLink.onclick = function(e) {
          e.preventDefault();
          // Use window.location instead of history.back() to ensure URL is set
          window.location.href = backURL;
        };
      }
    }
    
    // Load sales data for selected restaurant
    async function loadSalesData() {
      try {
        const response = await fetch(`/api/sales?restaurantId=${selectedRestaurantId}`);
        const allSalesData = await response.json();
        
        // Group sales by week
        groupSalesByWeek(allSalesData);
        
        // Populate week dropdown
        populateWeekDropdown();
        
        // Update back link to preserve restaurant selection
        updateBackLink();
        
        // Display first week by default
        const sortedWeeks = Object.keys(allWeekData).sort().reverse();
        if (sortedWeeks.length > 0) {
          document.getElementById('weekSelector').value = sortedWeeks[0];
          displayWeekSalesDetails(sortedWeeks[0]);
        }
      } catch (error) {
        console.error('Error loading sales data:', error);
        alert('Error loading sales data');
      }
    }
    
    // Load restaurants first, then sales data
    async function loadRestaurantsAndData() {
      try {
        // Get list of restaurants
        const restaurantsResponse = await fetch('/api/restaurants');
        const restaurants = await restaurantsResponse.json();
        
        if (restaurants.length === 0) {
          alert('No restaurants found');
          return;
        }
        
        // Use first restaurant
        selectedRestaurantId = restaurants[0].id;
        
        // Load sales data for the selected restaurant
        const salesResponse = await fetch(`/api/sales?restaurantId=${selectedRestaurantId}`);
        const allSalesData = await salesResponse.json();
        
        // Group sales by week
        groupSalesByWeek(allSalesData);
        
        // Populate week dropdown
        populateWeekDropdown();
        
        // Display first week by default
        const sortedWeeks = Object.keys(allWeekData).sort().reverse();
        if (sortedWeeks.length > 0) {
          document.getElementById('weekSelector').value = sortedWeeks[0];
          displayWeekSalesDetails(sortedWeeks[0]);
        }
      } catch (error) {
        console.error('Error loading data:', error);
        alert('Error loading sales data');
      }
    }
    
    // Group all sales data by week
    function groupSalesByWeek(salesData) {
      allWeekData = {};
      
      salesData.forEach(row => {
        if (!row.date) return;
        
        const dateStr = row.date.substring(0, 10);
        const date = new Date(dateStr + 'T00:00:00');
        const month = date.getMonth() + 1;
        const year = date.getFullYear();
        const day = date.getDate();
        const week = Math.ceil(day / 7);
        
        const monthYear = `${year}-${String(month).padStart(2, '0')}`;
        const weekKey = `${monthYear}-W${week}`;
        const weekLabel = `${monthYear} - Week ${week}`;
        
        if (!allWeekData[weekKey]) {
          allWeekData[weekKey] = {
            label: weekLabel,
            monthYear,
            week,
            rows: []
          };
        }
        
        allWeekData[weekKey].rows.push(row);
      });
    }
    
    // Populate week selector dropdown
    function populateWeekDropdown() {
      const dropdown = document.getElementById('weekSelector');
      dropdown.innerHTML = '';
      const sortedWeeks = Object.keys(allWeekData).sort().reverse();
      
      if (sortedWeeks.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'No sales data available';
        dropdown.appendChild(option);
        return;
      }
      
      sortedWeeks.forEach(weekKey => {
        const option = document.createElement('option');
        option.value = weekKey;
        option.textContent = allWeekData[weekKey].label + ` (${allWeekData[weekKey].rows.length} sales)`;
        dropdown.appendChild(option);
      });
    }
    
    // Display sales details for selected week
    function displayWeekSalesDetails(weekKey) {
      const fmt = (v) => '$' + Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
      
      const weekData = allWeekData[weekKey];
      if (!weekData) return;
      
      const tbody = document.getElementById('weekSalesTableBody');
      const summaryDiv = document.getElementById('weekSalesSummary');
      
      if (!tbody || !summaryDiv) return;
      
      tbody.innerHTML = '';
      
      let totalCash = 0, totalVisa = 0, totalDoordash = 0, totalGrubhub = 0, 
          totalUber = 0, totalOnline = 0, totalExpense = 0, totalSale = 0, totalCaptured = 0;
      
      weekData.rows.forEach(row => {
        const saleAmount = (row.cashAmount||0) + (row.visaAmount||0) + (row.doordashAmount||0) + 
                          (row.grubhubAmount||0) + (row.ubereatsAmount||0) + (row.onlineAmount||0) + (row.expenseAmount||0);
        
        totalCash += row.cashAmount || 0;
        totalVisa += row.visaAmount || 0;
        totalDoordash += row.doordashAmount || 0;
        totalGrubhub += row.grubhubAmount || 0;
        totalUber += row.ubereatsAmount || 0;
        totalOnline += row.onlineAmount || 0;
        totalExpense += row.expenseAmount || 0;
        totalSale += saleAmount;
        totalCaptured += row.capturedSaleAmount || 0;
        
        let highlight = '';
        if (saleAmount <= (row.capturedSaleAmount||0) - 200) {
          highlight = ' style="background:rgba(254,242,242,0.92)!important;color:#b91c1c !important;border:1px solid #dc2626 !important;"';
        }
        
        tbody.innerHTML += `<tr${highlight}>
          <td>${row.date ? row.date.substring(0,10) : ''}</td>
          <td>${fmt(row.capturedSaleAmount||0)}</td>
          <td>${fmt(row.cashAmount||0)}</td>
          <td>${fmt(row.visaAmount||0)}</td>
          <td>${fmt(row.doordashAmount||0)}</td>
          <td>${fmt(row.grubhubAmount||0)}</td>
          <td>${fmt(row.ubereatsAmount||0)}</td>
          <td>${fmt(row.onlineAmount||0)}</td>
          <td>${row.storeName||''}</td>
          <td>${fmt(row.expenseAmount||0)}</td>
          <td>${fmt(saleAmount)}</td>
        </tr>`;
      });
      
      tbody.innerHTML += `<tr style="background-color: #fef3c7; font-weight: bold;">
        <td>TOTAL</td>
        <td>${fmt(totalCaptured)}</td>
        <td>${fmt(totalCash)}</td>
        <td>${fmt(totalVisa)}</td>
        <td>${fmt(totalDoordash)}</td>
        <td>${fmt(totalGrubhub)}</td>
        <td>${fmt(totalUber)}</td>
        <td>${fmt(totalOnline)}</td>
        <td></td>
        <td>${fmt(totalExpense)}</td>
        <td>${fmt(totalSale)}</td>
      </tr>`;
      
      summaryDiv.innerHTML = `
        <div style="background:#f0f9ff;padding:12px;border-radius:8px;border-left:4px solid #2563eb;">
          <div style="font-size:12px;color:#666;margin-bottom:6px;">Total Captured</div>
          <div style="font-size:20px;font-weight:bold;color:#2563eb;">${fmt(totalCaptured)}</div>
        </div>
        <div style="background:#f0fdf4;padding:12px;border-radius:8px;border-left:4px solid #22c55e;">
          <div style="font-size:12px;color:#666;margin-bottom:6px;">Total Sale</div>
          <div style="font-size:20px;font-weight:bold;color:#22c55e;">${fmt(totalSale)}</div>
        </div>
        <div style="background:#fef3c7;padding:12px;border-radius:8px;border-left:4px solid #f59e42;">
          <div style="font-size:12px;color:#666;margin-bottom:6px;">Total Cash</div>
          <div style="font-size:20px;font-weight:bold;color:#f59e42;">${fmt(totalCash)}</div>
        </div>
        <div style="background:#fce7f3;padding:12px;border-radius:8px;border-left:4px solid #ec4899;">
          <div style="font-size:12px;color:#666;margin-bottom:6px;">Total Expense</div>
          <div style="font-size:20px;font-weight:bold;color:#ec4899;">${fmt(totalExpense)}</div>
        </div>
        <div style="background:#f3e8ff;padding:12px;border-radius:8px;border-left:4px solid #9333ea;">
          <div style="font-size:12px;color:#666;margin-bottom:6px;">Transaction Count</div>
          <div style="font-size:20px;font-weight:bold;color:#9333ea;">${weekData.rows.length}</div>
        </div>
      `;
    }
    
    // On week dropdown change
    function onWeekSelectorChange() {
      const dropdown = document.getElementById('weekSelector');
      if (dropdown && dropdown.value) {
        displayWeekSalesDetails(dropdown.value);
      }
    }
    
    // Re-initialize when needed
    function refreshDashboard() {
      loadSalesData();
    }
  </script>
</body>
</html>
